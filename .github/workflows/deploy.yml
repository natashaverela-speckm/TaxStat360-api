name: Deploy Lambda Functions

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy changed functions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Detect changed functions
        id: changed
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'functions/**' | \
            grep '^functions/' | \
            cut -d/ -f1-2 | \
            sort -u)
          echo "functions<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "Changed directories: $CHANGED"

      - name: Deploy changed functions
        if: steps.changed.outputs.functions != ''
        run: |
          while IFS= read -r fn_dir; do
            [ -z "$fn_dir" ] && continue
            FN_NAME=$(basename "$fn_dir")
            echo "=== Deploying $FN_NAME ==="
            cd "$fn_dir"
            zip -r /tmp/${FN_NAME}.zip . -x "*.zip"
            aws lambda update-function-code \
              --function-name "$FN_NAME" \
              --zip-file fileb:///tmp/${FN_NAME}.zip \
              --no-cli-pager
            cd "$GITHUB_WORKSPACE"
            echo "✅ $FN_NAME deployed"
          done <<< "${{ steps.changed.outputs.functions }}"
