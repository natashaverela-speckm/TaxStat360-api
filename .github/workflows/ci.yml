name: CI — API tests

# Runs the pytest suite on every push and PR to main. The backend deploys
# manually to EC2 (see docs/EC2-DEPLOY.md), so this is the gate that catches a
# regression BEFORE anyone copies app/main.py onto the box. It includes
# tests/test_integration_security.py, which pins the audit P0-#1 fixes:
#   - Swagger /docs, /redoc, /openapi.json are closed
#   - /integrations/{p}/data requires a session and ignores a token in the URL
#   - the OAuth callback leaks no token into its redirect
#   - forged/stale OAuth state is refused
# If any of those regress, this job fails and the change never ships.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: pytest (incl. integration security suite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # moto mocks DynamoDB and conftest.py sets the env vars app.main reads at
      # import, so no AWS credentials or live services are needed.
      # `python -m pytest` (NOT bare `pytest`): the module form puts the repo root on
      # sys.path, which tests/conftest.py needs for `import app.main`. The bare console
      # script does not, and collection dies with ModuleNotFoundError -> exit code 2.
      - name: Run tests
        run: python -m pytest -q
